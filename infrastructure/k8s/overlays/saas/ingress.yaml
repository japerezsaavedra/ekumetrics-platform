apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ekumetrics-redirect-https@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portal.ekumetrics.com
      secretName: portal-tls
  rules:
    - host: portal.ekumetrics.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-web
                port:
                  number: 8080
---
