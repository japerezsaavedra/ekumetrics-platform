# Este Secret es un placeholder. Cree el Secret real antes de aplicar:
#
# kubectl create secret generic ekumetrics-secrets \
#   --namespace ekumetrics \
#   --from-literal=postgres_password='<contraseña aleatoria de 16+ caracteres>' \
#   --from-literal=database_url='postgresql://ekumetrics:<contraseña>@postgres:5432/ekumetrics?schema=public' \
#   --from-literal=keycloak_db_password='<contraseña aleatoria de 16+ caracteres>' \
#   --from-literal=keycloak_admin_password='<contraseña aleatoria de 16+ caracteres>' \
#   --from-literal=grafana_admin_password='<contraseña aleatoria de 16+ caracteres>' \
#   --from-literal=ingest_shared_key='<32 caracteres aleatorios>' \
#   --from-literal=agent_edge_assertion_key='<32 caracteres aleatorios>' \
#   --from-literal=kiosk_token_secret='<32 caracteres aleatorios>' \
#   --from-literal=bff_session_secret='<32 caracteres aleatorios>' \
#   --from-literal=ai_settings_encryption_key='<32 caracteres aleatorios>' \
#   --from-literal=holmes_upstream_key='<32 caracteres aleatorios>'
#
# Para generar contraseñas aleatorias:
#   openssl rand -base64 24
#   openssl rand -hex 32
#
# Además, cree el Secret para los certificados mTLS de agentes:
#
# kubectl create secret generic agent-tls \
#   --namespace ekumetrics \
#   --from-file=ca.crt=/ruta/a/ca.crt \
#   --from-file=server.crt=/ruta/a/server.crt \
#   --from-file=server.key=/ruta/a/server.key
#
# Los certificados deben:
# - ca.crt: CA raíz que firma certificados de agentes
# - server.crt: Certificado del servidor con SAN=ingest.ekumetrics.com
# - server.key: Clave privada del servidor
# - Certificados de agentes deben tener Subject: O=<tenant_id>, OU=<site_id>, CN=<agent_id>
apiVersion: v1
kind: Secret
metadata:
  name: ekumetrics-secrets-placeholder
  annotations:
    description: "No usar este Secret. Es solo documentación. Ver comentarios arriba."
type: Opaque
stringData:
  postgres_password: "REQUIRED-CHANGE-ME"
  database_url: "REQUIRED-CHANGE-ME"
  keycloak_db_password: "REQUIRED-CHANGE-ME"
  keycloak_admin_password: "REQUIRED-CHANGE-ME"
  grafana_admin_password: "REQUIRED-CHANGE-ME"
  ingest_shared_key: "REQUIRED-CHANGE-ME"
  agent_edge_assertion_key: "REQUIRED-CHANGE-ME"
  kiosk_token_secret: "REQUIRED-CHANGE-ME"
  bff_session_secret: "REQUIRED-CHANGE-ME"
  ai_settings_encryption_key: "REQUIRED-CHANGE-ME"
  holmes_upstream_key: "REQUIRED-CHANGE-ME"
