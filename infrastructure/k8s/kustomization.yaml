apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ekumetrics

labels:
  - pairs:
      app.kubernetes.io/part-of: ekumetrics
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - postgres.yaml
  - keycloak-db.yaml
  - keycloak.yaml
  - nats.yaml
  - platform-api.yaml
  - portal-web.yaml
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - alertmanager.yaml
  - grafana.yaml
  - otel-collector.yaml
  - ingest-gateway.yaml
  - holmes.yaml
  - ollama.yaml
  - alloy.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - agent-edge.yaml
  - rbac.yaml
  - ingest-networkpolicy.yaml
  - ingress.yaml

configMapGenerator:
  - name: nats-config
    files:
      - nats-server.conf
  - name: keycloak-realm
    files:
      - ekumetrics-realm.json=keycloak-realm.json
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: prometheus-rules
    files:
      - slo-rules.yml=config/slo-rules.yml
      - capacity-rules.yml=config/capacity-rules.yml
  - name: loki-config
    files:
      - loki.yaml=config/loki.yaml
  - name: tempo-config
    files:
      - tempo.yaml=config/tempo.yaml
  - name: otel-config
    files:
      - config.yaml=config/otel.yaml
  - name: alertmanager-seed
    files:
      - alertmanager.yml=config/alertmanager.yml
  - name: grafana-datasources
    files:
      - datasources.yml=config/grafana/provisioning/datasources.yml
  - name: grafana-dashboards-provider
    files:
      - provider.yml=config/grafana/provisioning/provider.yml
  - name: grafana-dashboards
    files:
      - ekumetrics-agent.json=config/grafana/dashboards/ekumetrics-agent.json
      - ekumetrics-host.json=config/grafana/dashboards/ekumetrics-host.json
      - ekumetrics-icewarp.json=config/grafana/dashboards/ekumetrics-icewarp.json
      - ekumetrics-logs.json=config/grafana/dashboards/ekumetrics-logs.json
      - ekumetrics-slo.json=config/grafana/dashboards/ekumetrics-slo.json
  - name: ingest-gateway-template
    files:
      - default.conf.template=config/ingest-gateway/default.conf.template
  - name: ingest-gateway-loader
    files:
      - 15-load-secrets.envsh=config/ingest-gateway/15-load-secrets.envsh
  - name: holmes-config
    files:
      - config.yaml=config/holmes.yaml
  - name: alloy-config
    files:
      - config.alloy=config/alloy.alloy
  - name: agent-edge-template
    files:
      - default.conf.template=config/agent-edge/default.conf.template
  - name: agent-edge-loader
    files:
      - 15-load-secrets.envsh=config/agent-edge/15-load-secrets.envsh
  - name: platform-config
    literals:
      - DEPLOYMENT_MODE=local
      - PRODUCT_VERSION=1.0.0
      - PORTAL_PUBLIC_URL=http://ekumetrics.gd.lan
      - API_PUBLIC_URL=http://api-ekumetrics.gd.lan
      - KEYCLOAK_URL=http://auth-ekumetrics.gd.lan
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - CORS_ORIGIN=http://ekumetrics.gd.lan
      - PORTAL_API_URL=http://api-ekumetrics.gd.lan
      - PORTAL_GRAFANA_URL=http://grafana-ekumetrics.gd.lan
      - KEYCLOAK_REALM=ekumetrics
      - KEYCLOAK_AUDIENCE=portal-web
      - KEYCLOAK_CLIENT_ID=portal-web
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_REALM=master
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=ekumetrics-platform-api
      - ALERTMANAGER_URL=http://alertmanager:9093
      - HOLMES_URL=http://holmes:5050
      - OLLAMA_URL=http://ollama:11434/v1
      - AI_EMBEDDING_URL=http://ollama:11434
      - AI_EMBEDDING_MODEL=qwen3-embedding:0.6b
      - AI_DEFAULT_PROVIDER=ollama
      - EVENT_RETENTION_DAYS=30
      - EVENT_RETENTION_INTERVAL_MS=3600000
      - EVENT_RETENTION_BATCH_SIZE=1000
      - EVENT_RETENTION_MAX_BATCHES=20
      - NATS_URL=nats://nats:4222

