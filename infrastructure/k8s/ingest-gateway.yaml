apiVersion: v1
kind: Service
metadata:
  name: ingest-gateway
  labels:
    app.kubernetes.io/name: ingest-gateway
    app.kubernetes.io/component: ingest
spec:
  selector:
    app.kubernetes.io/name: ingest-gateway
  ports:
    - name: http
      port: 4318
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gateway
  labels:
    app.kubernetes.io/name: ingest-gateway
    app.kubernetes.io/component: ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-gateway
        app.kubernetes.io/component: ingest
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: INGEST_SHARED_KEY_FILE
              value: /opt/ekumetrics/secrets/ingest_shared_key
            - name: NGINX_ENVSUBST_FILTER
              value: "^INGEST_"
          ports:
            - name: http
              containerPort: 4318
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: loader
              mountPath: /docker-entrypoint.d/15-load-secrets.envsh
              subPath: 15-load-secrets.envsh
              readOnly: true
            - name: secrets
              mountPath: /opt/ekumetrics/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: template
          configMap:
            name: ingest-gateway-template
        - name: loader
          configMap:
            name: ingest-gateway-loader
            defaultMode: 0555
        - name: secrets
          secret:
            secretName: ekumetrics-secrets
            defaultMode: 0444
            items:
              - key: ingest_shared_key
                path: ingest_shared_key
