apiVersion: v1
kind: Service
metadata:
  name: holmes
  labels:
    app.kubernetes.io/name: holmes
    app.kubernetes.io/component: assistant
spec:
  selector:
    app.kubernetes.io/name: holmes
  ports:
    - name: http
      port: 5050
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes
  labels:
    app.kubernetes.io/name: holmes
    app.kubernetes.io/component: assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: holmes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holmes
        app.kubernetes.io/component: assistant
    spec:
      enableServiceLinks: false
      containers:
        - name: holmes
          image: robustadev/holmes:0.35.0
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-u", "server.py"]
          env:
            - name: HOLMES_PORT
              value: "5050"
            - name: OPENAI_API_BASE
              value: http://platform-api:3000/v1/ai/upstream
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: holmes_upstream_key
          ports:
            - name: http
              containerPort: 5050
          volumeMounts:
            - name: config
              mountPath: /root/.holmes
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: holmes-config
