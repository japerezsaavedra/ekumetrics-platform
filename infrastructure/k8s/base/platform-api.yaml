apiVersion: v1
kind: Service
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: platform-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z keycloak 8080; do
                echo "Waiting for keycloak..."
                sleep 2
              done
      containers:
        - name: platform-api
          image: ghcr.io/japerezsaavedra/ekumetrics-platform-api:dev
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: DEPLOYMENT_MODE
              value: production
            - name: PRODUCT_VERSION
              value: "1.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: database_url
            - name: CORS_ORIGIN
              value: https://portal.ekumetrics.com
            - name: PORTAL_PUBLIC_URL
              value: https://portal.ekumetrics.com
            - name: API_PUBLIC_URL
              value: https://api.ekumetrics.com
            - name: KEYCLOAK_URL
              value: https://auth.ekumetrics.com
            - name: KEYCLOAK_INTERNAL_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: ekumetrics
            - name: KEYCLOAK_AUDIENCE
              value: portal-web
            - name: KEYCLOAK_CLIENT_ID
              value: portal-web
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: keycloak_admin_password
            - name: KEYCLOAK_ADMIN_REALM
              value: master
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: LOKI_URL
              value: http://loki:3100
            - name: TEMPO_URL
              value: http://tempo:3200
            - name: ALERTMANAGER_URL
              value: http://alertmanager:9093
            - name: INGEST_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: ingest_shared_key
            - name: AGENT_EDGE_ASSERTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: agent_edge_assertion_key
            - name: KIOSK_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: kiosk_token_secret
            - name: BFF_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: bff_session_secret
            - name: AI_SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: ai_settings_encryption_key
            - name: HOLMES_URL
              value: http://holmes:5050
            - name: HOLMES_UPSTREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: holmes_upstream_key
            - name: AI_DEFAULT_PROVIDER
              value: ollama
            - name: OLLAMA_URL
              value: http://ollama:11434/v1
            - name: AI_EMBEDDING_URL
              value: http://ollama:11434
            - name: AI_EMBEDDING_MODEL
              value: qwen3-embedding:0.6b
            - name: EVENT_RETENTION_DAYS
              value: "30"
            - name: EVENT_RETENTION_INTERVAL_MS
              value: "3600000"
            - name: EVENT_RETENTION_BATCH_SIZE
              value: "1000"
            - name: EVENT_RETENTION_MAX_BATCHES
              value: "20"
            - name: AI_INQUIRY_RETENTION_DAYS
              value: "90"
            - name: AI_INQUIRY_RETENTION_INTERVAL_MS
              value: "3600000"
            - name: AI_INQUIRY_RETENTION_BATCH_SIZE
              value: "500"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
