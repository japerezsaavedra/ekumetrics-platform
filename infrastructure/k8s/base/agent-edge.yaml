apiVersion: v1
kind: Service
metadata:
  name: agent-edge
  labels:
    app.kubernetes.io/name: agent-edge
    app.kubernetes.io/component: gateway
  annotations:
    # Cloudflare DNS para ingest.ekumetrics.com debe ser DNS-only (grey cloud)
    # Orange cloud rompe mTLS client certificate verification
    external-dns.alpha.kubernetes.io/hostname: ingest.ekumetrics.com
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  selector:
    app.kubernetes.io/name: agent-edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-edge
  labels:
    app.kubernetes.io/name: agent-edge
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-edge
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-platform-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z platform-api 3000; do
                echo "Waiting for platform-api..."
                sleep 2
              done
        - name: wait-for-otel-collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z otel-collector 4317; do
                echo "Waiting for otel-collector..."
                sleep 2
              done
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          env:
            - name: INGEST_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: ingest_shared_key
            - name: AGENT_EDGE_ASSERTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: agent_edge_assertion_key
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: agent-tls
              mountPath: /run/agent-tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: agent-edge-config
        - name: agent-tls
          secret:
            secretName: agent-tls
            defaultMode: 0400
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-edge-config
data:
  default.conf: |
    server {
      listen 4317 ssl;
      http2 on;
      server_name _;

      ssl_certificate /run/agent-tls/server.crt;
      ssl_certificate_key /run/agent-tls/server.key;
      ssl_client_certificate /run/agent-tls/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_tickets off;

      location / {
        grpc_set_header X-Ekumetrics-Client-DN $ssl_client_s_dn;
        grpc_pass grpc://otel-collector:4317;
      }
    }

    server {
      listen 4318 ssl;
      server_name _;
      client_max_body_size 4m;

      ssl_certificate /run/agent-tls/server.crt;
      ssl_certificate_key /run/agent-tls/server.key;
      ssl_client_certificate /run/agent-tls/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_tickets off;

      location = /v1/ekms/events {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header X-Ekumetrics-Ingest-Key "${INGEST_SHARED_KEY}";
        proxy_set_header X-Ekumetrics-Edge-Assertion "${AGENT_EDGE_ASSERTION_KEY}";
        proxy_set_header X-Ekumetrics-Client-DN $ssl_client_s_dn;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_pass http://platform-api:3000;
      }

      location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header X-Ekumetrics-Client-DN $ssl_client_s_dn;
        proxy_pass http://otel-collector:4318;
      }

      location / {
        return 404;
      }
    }

    server {
      listen 8081;
      server_name _;

      location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"agent-edge"}\n';
      }

      location / {
        return 404;
      }
    }
