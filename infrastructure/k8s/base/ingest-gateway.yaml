apiVersion: v1
kind: Service
metadata:
  name: ingest-gateway
  labels:
    app.kubernetes.io/name: ingest-gateway
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app.kubernetes.io/name: ingest-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-gateway-nginx-config
data:
  default.conf: |
    server {
      listen 4318;
      server_name _;
      client_max_body_size 4m;

      location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"ingest-gateway"}\n';
      }

      location = /v1/ekms/events {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header X-Ekumetrics-Ingest-Key "${INGEST_SHARED_KEY}";
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_pass http://platform-api:3000;
      }

      location /v1/ {
        proxy_http_version 1.1;
        proxy_pass http://otel-collector:4318;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gateway
  labels:
    app.kubernetes.io/name: ingest-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-gateway
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-platform-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z platform-api 3000; do
                echo "Waiting for platform-api..."
                sleep 2
              done
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          env:
            - name: INGEST_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: ekumetrics-secrets
                  key: ingest_shared_key
          ports:
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4318
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: ingest-gateway-nginx-config
