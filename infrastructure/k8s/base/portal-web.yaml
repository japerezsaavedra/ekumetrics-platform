apiVersion: v1
kind: Service
metadata:
  name: portal-web
  labels:
    app.kubernetes.io/name: portal-web
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: portal-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  labels:
    app.kubernetes.io/name: portal-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-web
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-platform-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z platform-api 3000; do
                echo "Waiting for platform-api..."
                sleep 2
              done
      containers:
        - name: portal
          image: ghcr.io/japerezsaavedra/ekumetrics-portal-web:dev
          imagePullPolicy: Always
          env:
            - name: PORTAL_API_URL
              value: http://api.gd.lan
            - name: PORTAL_GRAFANA_URL
              value: http://grafana.eku.gd.lan
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
