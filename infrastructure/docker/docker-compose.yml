name: ekumetrics-lab

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekumetrics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekumetrics
      POSTGRES_PASSWORD: ekumetrics
      POSTGRES_DB: ekumetrics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekumetrics -d ekumetrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: ekumetrics-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: ekumetrics-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.4.3
    container_name: ekumetrics-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ekumetrics-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:12.0.2
    container_name: ekumetrics-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ekumetrics
      GF_SECURITY_ADMIN_PASSWORD: ekumetrics
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: ekumetrics-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ekumetrics-keycloak
    profiles: ["iam"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ekumetrics
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/ekumetrics-realm.json:/opt/keycloak/data/import/ekumetrics-realm.json:ro

  holmes:
    image: us-central1-docker.pkg.dev/genuine-flight-317411/devel/holmes
    container_name: ekumetrics-holmes
    profiles: ["ai"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5050:5050"
    env_file:
      - ../../apps/platform-api/.env
    environment:
      OPENAI_API_BASE: http://host.docker.internal:3000/v1/ai/upstream
      OPENAI_API_KEY: holmes-local
    volumes:
      - ./holmes:/root/.holmes:ro
    working_dir: /app
    entrypoint: ["python", "-u", "server.py"]
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:0.11.4
    container_name: ekumetrics-ollama
    profiles: ["ai-ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  ollama-data:
