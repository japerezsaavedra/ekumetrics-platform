name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --exit-code=1 /repo

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  repository:
    name: Dependencies, secrets and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build product images
        run: >-
          docker compose
          --env-file infrastructure/docker/.env.example
          -f infrastructure/docker/docker-compose.yml
          build platform-api portal-web
      - name: Build production identity image
        run: >-
          docker compose
          --env-file infrastructure/docker/.env.production.example
          -f infrastructure/docker/docker-compose.yml
          -f infrastructure/docker/docker-compose.production.yml
          build keycloak
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ekumetrics-platform-api:1.0.0
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Portal image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ekumetrics-portal-web:1.0.0
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Keycloak image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ekumetrics-keycloak:26.7.2
          trivyignores: .trivyignore.yaml
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  dast:
    name: Dynamic application security (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Scan hardened Portal image
        run: bash scripts/test-dast.sh
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-dast-${{ github.run_id }}
          path: artifacts/dast
          if-no-files-found: error
          retention-days: 30
