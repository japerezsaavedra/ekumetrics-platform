name: k8s-images

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to gd-k8s cluster'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: vars
        run: |
          echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push platform-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/platform-api/Dockerfile
          push: true
          tags: |
            ghcr.io/japerezsaavedra/ekumetrics-platform-api:dev
            ghcr.io/japerezsaavedra/ekumetrics-platform-api:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push portal-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/portal-web/Dockerfile
          push: true
          tags: |
            ghcr.io/japerezsaavedra/ekumetrics-portal-web:dev
            ghcr.io/japerezsaavedra/ekumetrics-portal-web:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to gd-k8s (manual)
    runs-on: gd-k8s
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for image availability
        run: |
          echo "Esperando 30s para que las imágenes estén disponibles en GHCR..."
          sleep 30

      - name: Apply manifests
        run: |
          kubectl apply -k infrastructure/k8s/overlays/lab

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/platform-api -n ekumetrics --timeout=5m
          kubectl rollout status deployment/portal-web -n ekumetrics --timeout=5m
          kubectl rollout status deployment/ingest-gateway -n ekumetrics --timeout=3m

      - name: Verify deployment
        run: |
          kubectl get pods -n ekumetrics
          kubectl get ingress -n ekumetrics
