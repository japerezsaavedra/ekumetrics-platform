openapi: 3.1.0
info:
  title: Ekumetrics Platform API
  version: 1.0.0
  description: Contrato HTTP de Ekumetrics Platform y Ekumetrics Agent 1.4.
servers:
  - url: http://localhost:3000
paths:
  /v1/auth/login:
    get:
      summary: Iniciar Authorization Code con PKCE en el BFF
      operationId: beginWebLogin
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
            pattern: "^/(?!/).*"
      responses:
        "302":
          description: Redirección al endpoint de autorización de Keycloak
  /v1/auth/callback:
    get:
      summary: Completar PKCE y crear una sesión web opaca
      operationId: completeWebLogin
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Cookie HttpOnly creada y redirección al portal
        "400":
          description: Transacción ausente, expirada o no coincidente
  /v1/auth/session:
    get:
      summary: Consultar y renovar la sesión web
      operationId: getWebSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Identidad efectiva y token CSRF ligado a la sesión
        "401":
          description: Sesión ausente, revocada o expirada
  /v1/auth/logout:
    post:
      summary: Revocar la sesión local y la sesión OIDC
      operationId: logoutWebSession
      security:
        - cookieAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: URL exacta para completar el logout en Keycloak
        "401":
          description: Sesión ausente o expirada
        "403":
          description: Token CSRF u origen inválido
  /health:
    get:
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: Servicio vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      summary: Readiness (PostgreSQL)
      operationId: getReady
      responses:
        "200":
          description: Base de datos alcanzable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Base de datos no disponible
  /v1/ekms/events:
    post:
      summary: Ingesta idempotente de envelopes del agente
      operationId: ingestEkmsEvents
      description: >
        Array JSON de envelope.Event. Content-Encoding gzip opcional.
        El agente deriva esta URL desde export.otlp.endpoint (puerto 4318). En producción,
        el borde exige mTLS y el Subject del certificado debe identificar O=tenant_id,
        OU=site_id y CN=agent_id. La API valida esa identidad y una afirmación privada del
        borde antes de persistir el lote; las cabeceras internas no forman parte del contrato
        del agente.
      security:
        - agentMutualTls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 256
              items:
                $ref: "#/components/schemas/EkmsEvent"
      responses:
        "202":
          description: Lote validado y persistido; informa aceptados y duplicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Envelope inválido
        "401":
          description: Canal de ingesta no autorizado
        "403":
          description: Certificado no coincidente o tenant, sitio o agente no registrado
        "413":
          description: Cuerpo superior al límite permitido
  /v1/incidents/{id}/investigate:
    post:
      summary: Disparar investigación AIOps (AgentOrchestrator)
      operationId: startIncidentInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Eku-Tenant
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retry:
                  type: boolean
      responses:
        "200":
          description: Investigación creada o en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiopsInvestigation"
        "409":
          description: Ya hay una investigación en curso
  /v1/incidents/{id}/investigation:
    get:
      summary: Última investigación AIOps del incidente
      operationId: getIncidentInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: version
          schema:
            type: integer
      responses:
        "200":
          description: Investigación o investigation null
  /v1/incidents/{id}/investigation/findings:
    get:
      summary: AgentFindings de la última investigación
      operationId: getIncidentInvestigationFindings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de findings de AIOps Agents
  /v1/incidents/{id}/investigation/retry:
    post:
      summary: Reintentar investigación (nueva version)
      operationId: retryIncidentInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nueva investigación
        "409":
          description: Investigación aún en curso
  /v1/incidents/{id}/investigation/cancel:
    post:
      summary: Cancelar investigación en curso
      operationId: cancelIncidentInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Investigación cancelada
  /v1/ai/status:
    get:
      summary: Servicios y modelos de IA configurados
      operationId: getAiStatus
      responses:
        "200":
          description: Estado de EkuAssistant AI, servicios y presets de modelo
  /v1/ai/settings:
    get:
      summary: Configuracion activa de IA (sin devolver la clave)
      operationId: getAiSettings
      responses:
        "200":
          description: Servicio, modelo y si hay clave guardada
    put:
      summary: Guardar servicio, modelo y credenciales en la base
      operationId: saveAiSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, model]
              properties:
                service:
                  type: string
                model:
                  type: string
                apiKey:
                  type: string
                baseUrl:
                  type: string
      responses:
        "200":
          description: Configuracion persistida
        "400":
          description: Servicio, modelo o credenciales invalidos
  /v1/ai/snapshot:
    get:
      summary: Snapshot de metricas del agente (Prometheus)
      operationId: getAiSnapshot
      parameters:
        - in: query
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hechos medidos del host
  /v1/ai/conversations:
    get:
      summary: Listar sesiones de EkuAssistant del tenant y usuario autenticados
      operationId: listAiConversations
      responses:
        "200":
          description: Resúmenes de sesiones autorizadas, sin cargar el historial completo
    post:
      summary: Crear una sesión server-side de EkuAssistant
      operationId: createAiConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 80
      responses:
        "201":
          description: Sesión creada con identificador opaco y política de retención
  /v1/ai/conversations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      summary: Recuperar una sesión autorizada y sus turnos
      operationId: getAiConversation
      responses:
        "200":
          description: Sesión del tenant y usuario autenticados
        "404":
          description: La sesión no existe dentro del ámbito autorizado
    delete:
      summary: Eliminar una sesión autorizada y sus investigaciones
      operationId: deleteAiConversation
      responses:
        "200":
          description: Sesión e investigaciones eliminadas
        "404":
          description: La sesión no existe dentro del ámbito autorizado
  /v1/ai/ask:
    post:
      summary: Pregunta a EkuAssistant AI
      operationId: askHolmes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                service:
                  type: string
                  description: ollama, openai, anthropic, kimi, grok, deepseek u openai_compat
                provider:
                  type: string
                  description: Alias de service (compatibilidad)
                model:
                  type: string
                  description: Id del modelo. Si se omite, se usa el default del servicio.
                conversationId:
                  type: string
                  description: Identificador opaco de una sesión server-side autorizada.
      responses:
        "201":
          description: Respuesta de EkuAssistant AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAskResponse"
        "400":
          description: Pregunta o proveedor inválido
        "503":
          description: EkuAssistant AI o el modelo no disponibles
  /v1/ai/knowledge/documents:
    get:
      summary: Listar el corpus aprobado dentro del tenant activo
      operationId: listAiKnowledgeDocuments
      responses:
        "200":
          description: Inventario de documentos, vigencia y cantidad de fragmentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiKnowledgeDocumentSummary"
    post:
      summary: Aprobar e indexar un documento de conocimiento dentro del tenant activo
      operationId: upsertAiKnowledgeDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKnowledgeDocumentInput"
      responses:
        "201":
          description: Documento aprobado e indexado de forma idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKnowledgeDocumentResult"
        "400":
          description: Documento o vigencia inválidos
        "503":
          description: El modelo de embeddings no está disponible
  /v1/ai/knowledge/documents/{id}:
    delete:
      summary: Eliminar un documento y propagar la eliminación a todos sus fragmentos
      operationId: deleteAiKnowledgeDocument
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documento y fragmentos eliminados
        "403":
          description: Documento fuera del tenant activo o inexistente
  /v1/kiosk/session:
    post:
      summary: Emitir o renovar una sesión corta para una pantalla registrada
      operationId: renewKioskSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskCredential"
      responses:
        "201":
          description: Token corto y alcance efectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSession"
        "401":
          description: Dispositivo desconocido, revocado o expirado
  /v1/kiosk/heartbeat:
    post:
      summary: Registrar actividad de una pantalla
      operationId: kioskHeartbeat
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Actividad registrada
        "401":
          description: Sesión inválida o revocada
  /v1/kiosk/devices:
    get:
      summary: Listar pantallas administradas
      operationId: listKioskDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dispositivos sin secretos
    post:
      summary: Registrar una identidad de pantalla
      operationId: createKioskDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskDeviceInput"
      responses:
        "201":
          description: Dispositivo y secreto visible una sola vez
  /v1/kiosk/devices/{id}:
    patch:
      summary: Cambiar nombre o alcance e invalidar tokens anteriores
      operationId: updateKioskDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KioskDeviceId"
      responses:
        "200":
          description: Dispositivo actualizado
  /v1/kiosk/devices/{id}/rotate:
    post:
      summary: Rotar la credencial e invalidar sesiones anteriores
      operationId: rotateKioskCredential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KioskDeviceId"
      responses:
        "201":
          description: Nueva credencial visible una sola vez
  /v1/kiosk/devices/{id}/revoke:
    post:
      summary: Revocar inmediatamente una pantalla
      operationId: revokeKioskDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KioskDeviceId"
      responses:
        "201":
          description: Dispositivo revocado
components:
  securitySchemes:
    agentMutualTls:
      type: mutualTLS
      description: Certificado cliente emitido por la CA de agentes de la instalación.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-eku_session
      description: Identificador opaco; solo HttpOnly, Secure y SameSite=Lax en producción.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    KioskDeviceId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    AiAskResponse:
      type: object
      required: [id, conversationId, provider, service, model, question, analysis, evidence, investigation]
      properties:
        id:
          type: string
        conversationId:
          type: string
        provider:
          type: string
        service:
          type: string
        model:
          type: string
        question:
          type: string
        analysis:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AiEvidence"
        investigation:
          $ref: "#/components/schemas/AiInvestigation"
        snapshot:
          type: [object, "null"]
          additionalProperties: true
    AiKnowledgeDocumentInput:
      type: object
      additionalProperties: false
      required: [sourceKey, sourceType, title, version, content]
      properties:
        sourceKey:
          type: string
          maxLength: 200
        sourceType:
          type: string
          enum: [product, runbook, postmortem]
        title:
          type: string
          maxLength: 300
        version:
          type: string
          maxLength: 80
        component:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 200000
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
    AiKnowledgeDocumentResult:
      type: object
      required: [id, sourceKey, version, chunks, checksum, approvedAt]
      properties:
        id:
          type: string
        sourceKey:
          type: string
        version:
          type: string
        chunks:
          type: integer
          minimum: 1
        checksum:
          type: string
          pattern: "^[a-f0-9]{64}$"
        approvedAt:
          type: string
          format: date-time
    AiKnowledgeDocumentSummary:
      type: object
      required: [id, sourceKey, sourceType, title, version, checksum, approvedBy, approvedAt, validFrom, updatedAt, chunkCount, status]
      properties:
        id:
          type: string
        sourceKey:
          type: string
        sourceType:
          type: string
          enum: [product, runbook, postmortem]
        title:
          type: string
        version:
          type: string
        component:
          type: [string, "null"]
        checksum:
          type: string
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
        chunkCount:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, scheduled, expired]
    AiEvidence:
      type: object
      required: [id, source, window, summary, timestamp, resultCount, citation]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [prometheus, loki, tempo, postgresql, inventory, knowledge]
        operation:
          type: string
        query:
          type: string
        window:
          $ref: "#/components/schemas/AiTimeWindow"
        summary:
          type: string
        timestamp:
          type: string
          format: date-time
        resultCount:
          type: integer
          minimum: 0
        available:
          type: boolean
        citation:
          type: string
          pattern: "^[MLTERK][1-9][0-9]*$"
        references:
          type: array
          items:
            type: object
            properties:
              traceId:
                type: string
              spanIds:
                type: array
                items:
                  type: string
              service:
                type: string
              operation:
                type: string
              durationMs:
                type: number
                minimum: 0
              documentId:
                type: string
              sourceKey:
                type: string
              title:
                type: string
              section:
                type: string
              version:
                type: string
              approvedAt:
                type: string
                format: date-time
    AiInvestigation:
      type: object
      required: [window, entities, sources, confidence, outcome]
      properties:
        window:
          $ref: "#/components/schemas/AiTimeWindow"
        entities:
          type: object
          required: [agents, sites]
          properties:
            agents:
              type: array
              items:
                type: string
            sites:
              type: array
              items:
                type: string
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [available, no_data, unavailable, not_requested]
        confidence:
          type: object
          required: [level, score, reason]
          properties:
            level:
              type: string
              enum: [high, medium, low]
            score:
              type: number
              minimum: 0
              maximum: 1
            reason:
              type: string
        outcome:
          type: string
          enum: [normal, attention, no_data]
    AiTimeWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    HealthStatus:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
    KioskCredential:
      type: object
      additionalProperties: false
      required: [deviceId, deviceSecret]
      properties:
        deviceId:
          type: string
        deviceSecret:
          type: string
          minLength: 32
    KioskDeviceInput:
      type: object
      additionalProperties: false
      required: [name, site, dashboard]
      properties:
        tenant:
          type: string
        name:
          type: string
        site:
          type: string
        dashboard:
          type: string
          enum: [hosts, network, databases, queues, icewarp, sap]
        credentialDays:
          type: integer
          minimum: 1
          maximum: 730
    KioskSession:
      type: object
      required: [accessToken, expiresIn, deviceSecret, scope]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          const: 600
        deviceSecret:
          type: string
        scope:
          type: object
          required: [tenant, site, dashboard]
          properties:
            tenant:
              type: string
            site:
              type: string
            dashboard:
              type: string
    EkmsEvent:
      type: object
      required: [timestamp, tenant_id, site_id, agent_id, signal, value, source]
      description: >
        Envelope del Ekumetrics Agent. Los campos AIOps (category, entity_type,
        correlation_key, environment, trace_id, metadata) son opcionales; los
        recolectores actuales siguen enviando solo el contrato original.
      properties:
        timestamp:
          type: string
          format: date-time
        tenant_id:
          type: string
        site_id:
          type: string
        agent_id:
          type: string
        asset_id:
          type: string
        asset_type:
          type: string
        vendor:
          type: string
        tier:
          type: integer
        signal:
          type: string
          enum:
            - asset_discovered
            - asset_updated
            - asset_stale
            - mac_changed
            - flow.bytes
            - flow.new
            - snmp.trap
            - neighbor_observed
            - metric.anomaly
            - log.signal
            - change.detected
            - deploy.observed
            - alert.received
        value:
          type: number
        unit:
          type: string
        severity:
          type: string
          enum: [info, warning, error, critical]
        source:
          type: string
        tags:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 512
        category:
          type: string
          enum:
            - ALERT
            - METRIC_SIGNAL
            - LOG_SIGNAL
            - CHANGE
            - DEPLOY
            - ASSET
            - NEIGHBOR
            - FLOW
            - TRAP
        entity_type:
          type: string
          description: Tipo de entidad AIOps; si se omite se usa asset_type
        correlation_key:
          type: string
        environment:
          type: string
          description: Si se omite se toma tags.environment cuando existe
        trace_id:
          type: string
        metadata:
          $ref: "#/components/schemas/EkmsEventMetadata"
    EkmsEventMetadata:
      type: object
      description: >
        Bolsa JSON no indexada. Snake_case en el wire (como el resto del envelope).
        No usar para tenant_id ni para campos que deban filtrarse.
      additionalProperties: false
      maxProperties: 32
      properties:
        labels:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 512
        attributes:
          type: object
          maxProperties: 32
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 512
              - type: number
              - type: boolean
        baseline:
          type: number
        deviation:
          type: number
        anomaly_score:
          type: number
        metric_name:
          type: string
        entity_id:
          type: string
        span_id:
          type: string
    IngestResult:
      type: object
      required: [status, received, accepted, duplicates]
      properties:
        status:
          type: string
          const: accepted
        received:
          type: integer
          minimum: 1
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
    AiopsInvestigation:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        incidentId:
          type: string
        status:
          type: string
        productStatus:
          type: string
          enum: [PENDING, RUNNING, PARTIAL, COMPLETED, FAILED, TIMEOUT, CANCELLED]
        version:
          type: integer
        selectedAgents:
          type: array
          items:
            type: string
        synthesisSummary:
          type: string
        investigationResult:
          type: object
