<div class="eku-chart-wrap">
  @if (canZoom()) {
    <button
      type="button"
      class="eku-chart__zoom"
      [class.is-on]="zoomOn()"
      [attr.title]="
        zoomOn() ? 'Desactivar zoom para desplazarte por la pagina' : 'Activar zoom con la rueda'
      "
      (click)="toggleZoom()"
    >
      {{ zoomOn() ? 'Zoom activo' : 'Zoom' }}
    </button>
  }
  <div class="eku-chart" #host></div>
</div>
