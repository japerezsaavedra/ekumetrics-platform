<!doctype html>
<html lang="es" class="eku-theme-light">
  <head>
    <meta charset="utf-8" />
    <title>Ekumetrics Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var mode = localStorage.getItem('eku-theme');
        if (mode !== 'dark' && mode !== 'light') {
          mode = 'light';
        }
        document.documentElement.classList.remove('eku-theme-light', 'eku-theme-dark');
        document.documentElement.classList.add('eku-theme-' + mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
