map $uri $eku_cache_control {
  default "no-store";
  "~*\.(?:css|woff2?|png|jpe?g|gif|svg|ico)$" "public, max-age=31536000, immutable";
  "~*-[A-Z0-9]{8}\.js$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  charset utf-8;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${PORTAL_API_URL}; manifest-src 'self'; worker-src 'self' blob:" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cache-Control "$eku_cache_control" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }
}
